<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма заказа</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            color-scheme: light;
        }

        body {
            font-family: sans-serif;
            background-color: var(--tg-theme-bg-color, #f4f4f4);
            color: var(--tg-theme-text-color, #111);
            padding: 20px;
            margin: 0;
        }

        .form {
            max-width: 420px;
            margin: 0 auto;
        }

        input,
        button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 10px;
            border: 1px solid #ccc;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #fff);
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        .hint {
            font-size: 14px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="form">
        <h3>Оформить заявку</h3>
        <input type="text" id="name" placeholder="Ваше имя" autocomplete="name">
        <input type="tel" id="phone" placeholder="Номер телефона" autocomplete="tel">
        <button id="send" type="button">Отправить данные</button>
        <p class="hint" id="hint"></p>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        const btn = document.getElementById("send");
        const hint = document.getElementById("hint");

        tg.ready();
        tg.expand();

        btn.addEventListener("click", () => {
            const name = document.getElementById("name").value.trim();
            const phone = document.getElementById("phone").value.trim();

            if (!name || !phone) {
                hint.textContent = "Заполните имя и телефон.";
                return;
            }

            const payload = JSON.stringify({ name, phone });

            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                tg.sendData(payload);
                tg.close();
                return;
            }

            hint.textContent = "Эта форма работает только внутри Telegram Web App.";
        });
    </script>
</body>
</html>

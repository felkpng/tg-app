<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма заказа</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background-color: var(--tg-theme-bg-color); color: var(--tg-theme-text-color); padding: 20px; }
        input, button { width: 100%; padding: 10px; margin: 10px 0; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background-color: var(--tg-theme-button-color); color: var(--tg-theme-button-text-color); border: none; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <h3>Оформить заявку</h3>
    <input type="text" id="name" placeholder="Ваше имя">
    <input type="tel" id="phone" placeholder="Номер телефона">
    <button id="send">Отправить данные</button>

    <script>
        const SERVER_URL = "http://91.135.212.23:8080/submit"; 
        
        btn.addEventListener('click', async () => {
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
        
            try {
                const response = await fetch(SERVER_URL, {
                    method: 'POST',
                    body: JSON.stringify({ name, phone }),
                    headers: { 'Content-Type': 'application/json' }
                });
        
                if (response.ok) {
                    tg.showAlert("Готово! Мы получили ваши данные.");
                    tg.close(); // Закрываем Mini App
                }
            } catch (err) {
                alert("Ошибка: " + err.message);
            }
        });
    </script>
</body>
</html>

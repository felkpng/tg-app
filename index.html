<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма заказа</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background-color: var(--tg-theme-bg-color); color: var(--tg-theme-text-color); padding: 20px; }
        input, button { width: 100%; padding: 10px; margin: 10px 0; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background-color: var(--tg-theme-button-color); color: var(--tg-theme-button-text-color); border: none; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <h3>Оформить заявку</h3>
    <input type="text" id="name" placeholder="Ваше имя">
    <input type="tel" id="phone" placeholder="Номер телефона">
    <button id="send">Отправить данные</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на все окно

        const btn = document.getElementById('send');

        btn.addEventListener('click', () => {
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;

            if (!name || !phone) {
                tg.showAlert("Пожалуйста, заполните все поля!");
                return;
            }

            const data = {
                name: name,
                phone: phone
            };

            // ГЛАВНЫЙ МОМЕНТ: отправка данных боту
            // Данные должны быть строкой
            tg.sendData(JSON.stringify(data));

            // После выполнения sendData приложение автоматически закроется
        });
    </script>
</body>
</html>

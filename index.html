<!DOCTYPE html>
<html>
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <title>Мое Mini App</title>
</head>
<body>
    <h1>Привет, <span id="username"></span>!</h1>
    <button id="main-btn">Нажми меня</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Развернуть на весь экран

        // Выводим имя пользователя
        document.getElementById('username').innerText = tg.initDataUnsafe.user?.first_name || "Гость";

        // Кнопка внутри приложения
        document.getElementById('main-btn').addEventListener('click', () => {
            tg.showAlert("Работает!");
        });
    </script>
</body>
</html>
